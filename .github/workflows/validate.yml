name: validate

on:
  push:
    branches:
      - feat/implement-local-adapter
  pull_request:
    branches:
      - main

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate config
        shell: pwsh
        run: pwsh -NoProfile -File tests/validate-config.ps1

      - name: Test system discovery
        shell: pwsh
        run: pwsh -NoProfile -File tests/test-collect-system-info.ps1

      - name: Test environment validator
        shell: pwsh
        run: pwsh -NoProfile -File tests/test-validate-comfy-env.ps1

      - name: Test safe bootstrap
        shell: pwsh
        run: pwsh -NoProfile -File tests/test-bootstrap-comfy.ps1

      - name: Test workflow installer
        shell: pwsh
        run: pwsh -NoProfile -File tests/test-link-workflows.ps1

      - name: Validate repository pre-runtime state
        shell: pwsh
        run: pwsh -NoProfile -File tests/validate-repo.ps1 -AllowIncompleteWorkflows
